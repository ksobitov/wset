[package]
name = "wset"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "Set keyboard auto-repeat on Wayland, like xset r rate"
license = "MIT"
repository = "https://github.com/ksobitov/wset"
homepage = "https://github.com/ksobitov/wset"
readme = "README.md"
keywords = ["wayland", "xset", "keyboard", "repeat"]
categories = ["command-line-utilities"]
exclude = ["/packaging"]

[dependencies]
serde_json = "1"
wayland-client = "0.31.15"

[package.metadata.deb]
maintainer = "Komiljon Sobitov <komiljon.sobitov.uzb@gmail.com>"
copyright = "2026 Komiljon Sobitov <komiljon.sobitov.uzb@gmail.com>"
license-file = ["LICENSE", "0"]
section = "utils"
depends = "$auto"
changelog = "packaging/changelog"
extended-description = """\
wset changes keyboard auto-repeat on Wayland, with the same commands as \
xset: wset r rate 210 30 sets a 210 ms delay and 30 repeats per second. \
It supports GNOME and Sway, and wset q shows the settings any compositor \
uses."""
recommends = "libglib2.0-bin"
assets = [
    ["target/release/wset", "usr/bin/", "755"],
    ["wset.1", "usr/share/man/man1/", "644"],
    ["README.md", "usr/share/doc/wset/", "644"],
    ["packaging/lintian-overrides", "usr/share/lintian/overrides/wset", "644"],
]

[profile.release]
lto = true
codegen-units = 1
strip = true
